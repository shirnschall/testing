name: ios

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  NETGEN_COMMIT: 98232f962908dd16402f2cab343b62ea981a7c64
  NGSOLVE_COMMIT: fb1c068b7a353d893bdc6b7f6c538b4338f39038
  PLANEX2D_VERSION: "0.4.1"
  OCCT_TAG: V8_0_1
  OCCT_SEED_RUN: "44445999000"
  OCCT_CACHE_KEY: occt-ios-V8_0_1-17.0-2
  NETGEN_CACHE_KEY: netgen-ios-98232f962908-occt-ios-V8_0_1-17.0-2-py313-2
  NGSOLVE_CACHE_KEY: ngsolve-ios-fb1c068b7a35-netgen-ios-98232f962908-occt-ios-V8_0_1-17.0-2-py313-2-1
  IOS_DEPLOYMENT_TARGET: "17.0"
  PYTHON_IOS_URL: https://github.com/beeware/Python-Apple-support/releases/download/3.13-b18/Python-3.13-iOS-support.b18.tar.gz

jobs:
  occt:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: iphoneos
            suffix: ""
          - sdk: iphonesimulator
            suffix: "-sim"
    runs-on: macos-15
    timeout-minutes: 240
    env:
      SDK: ${{ matrix.sdk }}
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: occt-prefix
          key: ${{ env.OCCT_CACHE_KEY }}${{ matrix.suffix }}

      - id: seed
        if: steps.cache.outputs.cache-hit != 'true' && matrix.sdk == 'iphoneos'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: occt-ios
          run-id: ${{ env.OCCT_SEED_RUN }}
          github-token: ${{ github.token }}
          path: seed

      - id: need
        run: |
          if [ ! -d occt-prefix ] && [ -f seed/occt-ios.tgz ]; then
            tar -xzf seed/occt-ios.tgz
          fi
          cfg=$(find occt-prefix -name OpenCASCADEConfig.cmake 2>/dev/null | head -1)
          dylib=$(find occt-prefix -name libocct.dylib 2>/dev/null | head -1)
          echo "config $cfg"
          echo "shared $dylib"
          if [ -n "$cfg" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$dylib" ]; then
            echo "shared=false" >> "$GITHUB_OUTPUT"
          else
            echo "shared=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.need.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: Open-Cascade-SAS/OCCT
          ref: ${{ env.OCCT_TAG }}
          path: occt

      - if: steps.need.outputs.shared == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: tools
        if: steps.need.outputs.shared == 'true'
        run: python -m pip install "cmake>=4" ninja

      - name: build
        if: steps.need.outputs.build == 'true'
        run: |
          cmake -S occt -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/occt-prefix" \
            -DBUILD_LIBRARY_TYPE=Static \
            -DBUILD_MODULE_FoundationClasses=ON \
            -DBUILD_MODULE_ModelingData=ON \
            -DBUILD_MODULE_ModelingAlgorithms=ON \
            -DBUILD_MODULE_DataExchange=ON \
            -DBUILD_MODULE_Visualization=OFF \
            -DBUILD_MODULE_ApplicationFramework=OFF \
            -DBUILD_MODULE_Draw=OFF \
            -DBUILD_MODULE_DETools=OFF \
            -DUSE_FREETYPE=OFF \
            -DUSE_OPENGL=OFF \
            -DUSE_XLIB=OFF \
            -DBUILD_DOC_Overview=OFF \
            2>&1 | tee occt-configure.log
          cmake --build build -j 3 2>&1 | tee occt-build.log
          cmake --install build 2>&1 | tee -a occt-build.log

      - name: shared
        if: steps.need.outputs.shared == 'true'
        run: |
          cfg=$(dirname "$(find "$PWD/occt-prefix" -name OpenCASCADEConfig.cmake | head -1)")
          lib=$(dirname "$(find "$PWD/occt-prefix" -name libTKernel.a | head -1)")
          mkdir -p occt-shared
          printf '%s\n' \
            'cmake_minimum_required(VERSION 3.24)' \
            'project(occt CXX)' \
            'find_package(OpenCASCADE REQUIRED CONFIG)' \
            'file(WRITE ${CMAKE_BINARY_DIR}/occt.cpp "")' \
            'add_library(occt SHARED ${CMAKE_BINARY_DIR}/occt.cpp)' \
            'target_link_options(occt PRIVATE LINKER:-all_load)' \
            'target_link_libraries(occt PRIVATE ${OpenCASCADE_LIBRARIES} "-framework Foundation")' \
            > occt-shared/CMakeLists.txt
          cmake -S occt-shared -B occt-shared/build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_BUILD_TYPE=Release \
            -DOpenCASCADE_DIR="$cfg"
          cmake --build occt-shared/build -v 2>&1 | tee occt-shared.log
          cp occt-shared/build/libocct.dylib "$lib/"
          otool -D "$lib/libocct.dylib"
          otool -L "$lib/libocct.dylib"
          sed -i '' -E 's#/libTK[A-Za-z0-9]+\.a#/libocct.dylib#g' "$cfg"/OpenCASCADE*Targets-release.cmake
          grep -c libocct.dylib "$cfg"/OpenCASCADE*Targets-release.cmake
          if grep -n 'libTK[A-Za-z0-9]*\.a' "$cfg"/OpenCASCADE*Targets-release.cmake; then exit 1; fi

      - name: libraries
        run: |
          find occt-prefix -name OpenCASCADEConfig.cmake
          find occt-prefix -name 'libTK*.a' | sort
          ls -la "$(find occt-prefix -name libocct.dylib | head -1)"

  netgen:
    needs: occt
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: iphoneos
            slice: ios-arm64
            suffix: ""
          - sdk: iphonesimulator
            slice: ios-arm64_x86_64-simulator
            suffix: "-sim"
    runs-on: macos-15
    timeout-minutes: 120
    env:
      SDK: ${{ matrix.sdk }}
      SLICE: ${{ matrix.slice }}
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: prefix
          key: ${{ env.NETGEN_CACHE_KEY }}${{ matrix.suffix }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: occt-prefix
          key: ${{ env.OCCT_CACHE_KEY }}${{ matrix.suffix }}
          fail-on-cache-miss: true

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: NGSolve/netgen
          ref: ${{ env.NETGEN_COMMIT }}
          path: netgen
          fetch-depth: 0
          submodules: recursive

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -m pip install "cmake>=4" ninja

      - name: python for ios
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o pyios.tgz "$PYTHON_IOS_URL"
          mkdir pyios
          tar -xzf pyios.tgz -C pyios
          inc=$(find "$PWD/pyios" -type d -path "*$SLICE/include/python3.13" | head -1)
          lib=$(find "$PWD/pyios" -path "*$SLICE/Python.framework/Python" | head -1)
          echo "include $inc"
          echo "library $lib"
          [ -n "$inc" ]
          [ -n "$lib" ]
          echo "PY_IOS_INC=$inc" >> "$GITHUB_ENV"
          echo "PY_IOS_ROOT=$(dirname "$(dirname "$inc")")" >> "$GITHUB_ENV"
          echo "PY_IOS_LIB=$lib" >> "$GITHUB_ENV"

      - name: patch
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sed -i '' 's/^      if(NOT EMSCRIPTEN)$/      if(NOT EMSCRIPTEN AND NOT CMAKE_CROSSCOMPILING)/' netgen/CMakeLists.txt
          grep -n "if(NOT EMSCRIPTEN AND NOT CMAKE_CROSSCOMPILING)" netgen/CMakeLists.txt

      - name: occt config
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "OCCT_CMAKE_DIR=$(dirname "$(find "$PWD/occt-prefix" -name OpenCASCADEConfig.cmake | head -1)")" >> "$GITHUB_ENV"

      - name: makerls
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/host"
          c++ -O2 netgen/rules/makerlsfile.cpp -o "$RUNNER_TEMP/host/makerls"
          echo "$RUNNER_TEMP/host" >> "$GITHUB_PATH"

      - name: configure
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -S netgen -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/prefix" \
            -DUSE_SUPERBUILD=OFF \
            -DUSE_GUI=OFF \
            -DUSE_PYTHON=ON \
            -DUSE_OCC=ON \
            -DOpenCascade_DIR="$OCCT_CMAKE_DIR" \
            -DUSE_NATIVE_ARCH=OFF \
            -DBUILD_STUB_FILES=OFF \
            -DPREFER_SYSTEM_PYBIND11=OFF \
            -DNG_INSTALL_PYBIND=ON \
            -DPYBIND11_USE_CROSSCOMPILING=ON \
            -DPython3_EXECUTABLE="$(command -v python)" \
            -DPython3_INCLUDE_DIR="$PY_IOS_INC" \
            -DPython3_LIBRARY="$PY_IOS_LIB" \
            -DPython_ROOT_DIR="$PY_IOS_ROOT" \
            -DPython_INCLUDE_DIR="$PY_IOS_INC" \
            -DPython_LIBRARY="$PY_IOS_LIB" \
            -DNG_INSTALL_DIR_PYTHON=python \
            2>&1 | tee configure.log

      - name: build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake --build build -j 3 2>&1 | tee build.log
          cmake --install build 2>&1 | tee -a build.log

      - name: modules
        run: |
          find prefix \( -name '*.so' -o -name '*.dylib' \) | sort
          find prefix -name NetgenConfig.cmake -o -path '*pybind11/pybind11.h' -o -path '*netgen/version.py'
          for f in $(find prefix \( -name '*.so' -o -name '*.dylib' \)); do
            echo "$f"
            otool -L "$f" | grep -i -E "occ|TK" || true
          done

      - uses: actions/upload-artifact@v4
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          name: netgen-${{ matrix.sdk }}
          path: |
            configure.log
            build.log
            build/CMakeCache.txt

  ngsolve:
    needs: netgen
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: iphoneos
            slice: ios-arm64
            suffix: ""
          - sdk: iphonesimulator
            slice: ios-arm64_x86_64-simulator
            suffix: "-sim"
    runs-on: macos-15
    timeout-minutes: 180
    env:
      SDK: ${{ matrix.sdk }}
      SLICE: ${{ matrix.slice }}
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: ngsolve-prefix
          key: ${{ env.NGSOLVE_CACHE_KEY }}${{ matrix.suffix }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: occt-prefix
          key: ${{ env.OCCT_CACHE_KEY }}${{ matrix.suffix }}
          fail-on-cache-miss: true

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: prefix
          key: ${{ env.NETGEN_CACHE_KEY }}${{ matrix.suffix }}
          fail-on-cache-miss: true

      - name: netgen
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "OCCT_CMAKE_DIR=$(dirname "$(find "$PWD/occt-prefix" -name OpenCASCADEConfig.cmake | head -1)")" >> "$GITHUB_ENV"
          echo "NETGEN_CMAKE_DIR=$(dirname "$(find "$PWD/prefix" -name NetgenConfig.cmake | head -1)")" >> "$GITHUB_ENV"

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: NGSolve/ngsolve
          ref: ${{ env.NGSOLVE_COMMIT }}
          path: ngsolve
          fetch-depth: 0
          submodules: recursive

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -m pip install "cmake>=4" ninja

      - name: python for ios
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o pyios.tgz "$PYTHON_IOS_URL"
          mkdir pyios
          tar -xzf pyios.tgz -C pyios
          inc=$(find "$PWD/pyios" -type d -path "*$SLICE/include/python3.13" | head -1)
          lib=$(find "$PWD/pyios" -path "*$SLICE/Python.framework/Python" | head -1)
          [ -n "$inc" ]
          [ -n "$lib" ]
          echo "PY_IOS_INC=$inc" >> "$GITHUB_ENV"
          echo "PY_IOS_ROOT=$(dirname "$(dirname "$inc")")" >> "$GITHUB_ENV"
          echo "PY_IOS_LIB=$lib" >> "$GITHUB_ENV"

      - name: patch
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sed -i '' 's/std::system (cmd.c_str()) != 0/true/' ngsolve/ngstd/gpu_cpu.cpp
          sed -i '' 's/int err = system((chdir_cmd + scompile).c_str());/int err = 1;/' ngsolve/fem/code_generation.cpp
          sed -i '' 's/int err = system((chdir_cmd + slink).c_str());/int err = 1;/' ngsolve/fem/code_generation.cpp
          if grep -nE "[^a-zA-Z_]system *\(" ngsolve/ngstd/gpu_cpu.cpp ngsolve/fem/code_generation.cpp; then exit 1; fi

      - name: kernel_generator
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/host"
          c++ -std=c++20 -O2 ngsolve/basiclinalg/generate_mat_kernels.cpp -o "$RUNNER_TEMP/host/kernel_generator"
          echo "$RUNNER_TEMP/host" >> "$GITHUB_PATH"

      - name: configure
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "netgen $NETGEN_CMAKE_DIR"
          echo "occt $OCCT_CMAKE_DIR"
          pyb="$PWD/ngsolve/external_dependencies/netgen/external_dependencies/pybind11/include"
          ls "$pyb/pybind11/pybind11.h"
          veclib="$(xcrun --sdk "$SDK" --show-sdk-path)/System/Library/Frameworks/Accelerate.framework/Frameworks"
          ls "$veclib/vecLib.framework/Headers/cblas.h" "$veclib/vecLib.framework/Headers/Sparse/Solve.h"
          cmake -S ngsolve -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-march=armv8.3-a" \
            -DCMAKE_CXX_FLAGS="-march=armv8.3-a -F$veclib" \
            -DCMAKE_INSTALL_PREFIX="$PWD/ngsolve-prefix" \
            -DUSE_SUPERBUILD=OFF \
            -DNetgen_DIR="$NETGEN_CMAKE_DIR" \
            -DOpenCascade_DIR="$OCCT_CMAKE_DIR" \
            -DUSE_LAPACK=ON \
            -DLAPACK_LIBRARIES="-framework Accelerate" \
            -DUSE_MKL=OFF \
            -DUSE_PARDISO=OFF \
            -DUSE_UMFPACK=OFF \
            -DUSE_MUMPS=OFF \
            -DUSE_HYPRE=OFF \
            -DUSE_MPI=OFF \
            -DUSE_CUDA=OFF \
            -DUSE_GUI=OFF \
            -DUSE_NATIVE_ARCH=OFF \
            -DMAX_SYS_DIM=1 \
            -DUSE_FASTCOMPILE=1 \
            -DBUILD_STUB_FILES=OFF \
            -DBUILD_FOR_CONDA=ON \
            -DUSE_PYTHON=ON \
            -DPYBIND11_USE_CROSSCOMPILING=ON \
            -DNETGEN_PYBIND_INCLUDE_DIR="$pyb" \
            -DPython3_EXECUTABLE="$(command -v python)" \
            -DPython3_INCLUDE_DIR="$PY_IOS_INC" \
            -DPython3_LIBRARY="$PY_IOS_LIB" \
            -DPython_ROOT_DIR="$PY_IOS_ROOT" \
            -DPython_INCLUDE_DIR="$PY_IOS_INC" \
            -DPython_LIBRARY="$PY_IOS_LIB" \
            -DNG_INSTALL_DIR_PYTHON=python \
            2>&1 | tee configure.log

      - name: build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake --build build -j 3 2>&1 | tee build.log
          cmake --install build 2>&1 | tee -a build.log

      - name: modules
        run: |
          find ngsolve-prefix \( -name '*.so' -o -name '*.dylib' \) | sort
          find ngsolve-prefix -name NGSolveConfig.cmake

      - uses: actions/upload-artifact@v4
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          name: ngsolve-${{ matrix.sdk }}
          path: |
            configure.log
            build.log
            build/CMakeCache.txt

  planex2d-occ:
    needs: netgen
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: iphoneos
            slice: ios-arm64
            suffix: ""
          - sdk: iphonesimulator
            slice: ios-arm64_x86_64-simulator
            suffix: "-sim"
    runs-on: macos-15
    timeout-minutes: 90
    env:
      SDK: ${{ matrix.sdk }}
      SLICE: ${{ matrix.slice }}
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: occt-prefix
          key: ${{ env.OCCT_CACHE_KEY }}${{ matrix.suffix }}
          fail-on-cache-miss: true

      - uses: actions/cache/restore@v4
        with:
          path: prefix
          key: ${{ env.NETGEN_CACHE_KEY }}${{ matrix.suffix }}
          fail-on-cache-miss: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: tools
        run: python -m pip install "cmake>=4" ninja

      - name: python for ios
        run: |
          curl -sSL -o pyios.tgz "$PYTHON_IOS_URL"
          mkdir pyios
          tar -xzf pyios.tgz -C pyios
          inc=$(find "$PWD/pyios" -type d -path "*$SLICE/include/python3.13" | head -1)
          lib=$(find "$PWD/pyios" -path "*$SLICE/Python.framework/Python" | head -1)
          sysdata=$(find "$PWD/pyios" -name "_sysconfigdata_*arm64-$SDK*.py" | head -1)
          soabi=$(sed -n "s/.*'SOABI': '\([^']*\)'.*/\1/p" "$sysdata" | head -1)
          echo "sysconfig $sysdata"
          echo "soabi $soabi"
          [ -n "$inc" ]
          [ -n "$lib" ]
          [ -n "$soabi" ]
          echo "PY_IOS_INC=$inc" >> "$GITHUB_ENV"
          echo "PY_IOS_LIB=$lib" >> "$GITHUB_ENV"
          echo "PY_IOS_SOABI=$soabi" >> "$GITHUB_ENV"

      - name: sources
        run: |
          curl -sSfL --retry 3 -o planex2d.tgz "https://files.pythonhosted.org/packages/source/p/planex2d/planex2d-$PLANEX2D_VERSION.tar.gz"
          tar -xzf planex2d.tgz

      - name: configure
        run: |
          occt=$(dirname "$(find "$PWD/occt-prefix" -name OpenCASCADEConfig.cmake | head -1)")
          netgen=$(dirname "$(find "$PWD/prefix" -name NetgenConfig.cmake | head -1)")
          echo "occt $occt"
          echo "netgen $netgen"
          cmake -S "planex2d-$PLANEX2D_VERSION" -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/planex-prefix" \
            -DPLANEX_CORE=OFF \
            -DPLANEX_OCC=ON \
            -DPLANEX_VERSION="$PLANEX2D_VERSION" \
            -DPLANEX_OCC_DESTINATION=planex \
            -DNetgen_DIR="$netgen" \
            -DOpenCASCADE_DIR="$occt" \
            -DPython3_EXECUTABLE="$(command -v python)" \
            -DPython3_INCLUDE_DIR="$PY_IOS_INC" \
            -DPython3_LIBRARY="$PY_IOS_LIB" \
            -DPython3_SOABI="$PY_IOS_SOABI" \
            2>&1 | tee configure.log

      - name: build
        run: |
          cmake --build build 2>&1 | tee build.log
          cmake --install build 2>&1 | tee -a build.log
          find planex-prefix -type f
          otool -L "$(find planex-prefix -name '_planex_occ*.so' | head -1)"

      - uses: actions/upload-artifact@v4
        with:
          name: planex2d-occ-${{ matrix.sdk }}
          path: planex-prefix

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planex2d-occ-logs-${{ matrix.sdk }}
          path: |
            configure.log
            build.log
            build/CMakeCache.txt

  planex2d-core:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: sources
        run: curl -sSfL --retry 3 -o "planex2d-$PLANEX2D_VERSION.tar.gz" "https://files.pythonhosted.org/packages/source/p/planex2d/planex2d-$PLANEX2D_VERSION.tar.gz"

      - name: wheels
        env:
          IPHONEOS_DEPLOYMENT_TARGET: ${{ env.IOS_DEPLOYMENT_TARGET }}
          CIBW_PLATFORM: ios
          CIBW_BUILD: cp313-ios_arm64_iphoneos cp313-ios_arm64_iphonesimulator
          CIBW_ENVIRONMENT: IPHONEOS_DEPLOYMENT_TARGET=${{ env.IOS_DEPLOYMENT_TARGET }}
          CIBW_CONFIG_SETTINGS: cmake.define.PLANEX_OCC=OFF
          CIBW_XBUILD_TOOLS: cmake ninja
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -m pytest -v tests/ios_smoke_test.py
          CIBW_BUILD_VERBOSITY: 1
          PIP_EXTRA_INDEX_URL: https://pypi.anaconda.org/beeware/simple
          PIP_ONLY_BINARY: numpy
        run: |
          python -m pip install cibuildwheel==4.3.5
          python -m cibuildwheel --output-dir wheelhouse "planex2d-$PLANEX2D_VERSION.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: planex2d-core-ios
          path: wheelhouse/*.whl

  simulator:
    needs: [ngsolve, planex2d-occ, planex2d-core]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: occt-prefix
          key: ${{ env.OCCT_CACHE_KEY }}-sim
          fail-on-cache-miss: true

      - uses: actions/cache/restore@v4
        with:
          path: prefix
          key: ${{ env.NETGEN_CACHE_KEY }}-sim
          fail-on-cache-miss: true

      - uses: actions/cache/restore@v4
        with:
          path: ngsolve-prefix
          key: ${{ env.NGSOLVE_CACHE_KEY }}-sim
          fail-on-cache-miss: true

      - uses: actions/download-artifact@v4
        with:
          name: planex2d-occ-iphonesimulator
          path: planex-prefix

      - uses: actions/download-artifact@v4
        with:
          name: planex2d-core-ios
          path: wheels

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: python for ios
        run: |
          curl -sSL -o pyios.tgz "$PYTHON_IOS_URL"
          mkdir pyios
          tar -xzf pyios.tgz -C pyios
          ls pyios

      - name: app
        env:
          PIP_EXTRA_INDEX_URL: https://pypi.anaconda.org/beeware/simple
        run: |
          python pyios/testbed clone testbed
          app="$PWD/testbed/iOSTestbed"
          stage="$PWD/stage"
          libs="$stage/ios_libs"
          mkdir -p "$libs" "$stage/planex"
          for init in "$(find "$PWD/prefix" -path '*/netgen/__init__.py' | head -1)" "$(find "$PWD/ngsolve-prefix" -path '*/ngsolve/__init__.py' | head -1)"; do
            echo "package $init"
            [ -f "$init" ]
            cp -R "$(dirname "$(dirname "$init")")"/. "$stage/"
          done
          cp "$(find planex-prefix -name '_planex_occ*.so' | head -1)" "$stage/planex/"
          find occt-prefix prefix ngsolve-prefix -name '*.dylib' -exec cp -L {} "$libs/" \;
          find "$stage" -name '*.cpython-*.so' ! -name '*-iphonesimulator.so' | while read -r f; do
            mv "$f" "${f%.cpython-*}.so"
          done
          find "$stage" -type f \( -name '*.so' -o -name '*.dylib' \) | while read -r f; do
            id=$(otool -D "$f" | tail -n +2)
            args=()
            for rp in $(otool -l "$f" | awk '/cmd LC_RPATH/{getline; getline; print $2}'); do
              args+=(-delete_rpath "$rp")
            done
            for dep in $(otool -L "$f" | tail -n +2 | awk '{print $1}'); do
              base=$(basename "$dep")
              if [ "$dep" != "$id" ] && [ -f "$libs/$base" ] && [ "$dep" != "@rpath/$base" ]; then
                args+=(-change "$dep" "@rpath/$base")
              fi
            done
            if [ -n "$id" ]; then
              args+=(-id "@rpath/$(basename "$f")")
            fi
            args+=(-add_rpath @executable_path/app_packages/ios_libs)
            install_name_tool "${args[@]}" "$f"
            codesign --force --sign - "$f"
            echo "$f"
            otool -L "$f" | tail -n +2
          done
          python -m pip install --only-binary=:all: --platform "ios_${IOS_DEPLOYMENT_TARGET/./_}_arm64_iphonesimulator" --target "$app/app_packages" "$(ls wheels/*iphonesimulator.whl | head -1)" pytest
          cp -R "$stage"/. "$app/app_packages/"
          cp tests/ios_stack_test.py "$app/app/"
          ls "$app/app_packages" "$app/app_packages/ios_libs"

      - name: run
        run: |
          xcrun simctl list devices available | grep -i -E "ipad|iphone 16e" || true
          python testbed run --verbose --simulator "iPhone 16e,OS=18.5" -- ios_stack_test
