name: ios

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  NETGEN_COMMIT: 98232f962908dd16402f2cab343b62ea981a7c64
  NGSOLVE_COMMIT: fb1c068b7a353d893bdc6b7f6c538b4338f39038
  OCCT_TAG: V8_0_1
  OCCT_SEED_RUN: "44445999000"
  OCCT_CACHE_KEY: occt-ios-V8_0_1-17.0-1
  NETGEN_CACHE_KEY: netgen-ios-98232f962908-occt-ios-V8_0_1-17.0-1-py313-1
  IOS_DEPLOYMENT_TARGET: "17.0"

jobs:
  occt:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: occt-prefix
          key: ${{ env.OCCT_CACHE_KEY }}

      - id: seed
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: occt-ios
          run-id: ${{ env.OCCT_SEED_RUN }}
          github-token: ${{ github.token }}
          path: seed

      - id: need
        run: |
          if [ ! -d occt-prefix ] && [ -f seed/occt-ios.tgz ]; then
            tar -xzf seed/occt-ios.tgz
          fi
          cfg=$(find occt-prefix -name OpenCASCADEConfig.cmake 2>/dev/null | head -1)
          echo "config $cfg"
          if [ -n "$cfg" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.need.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: Open-Cascade-SAS/OCCT
          ref: ${{ env.OCCT_TAG }}
          path: occt

      - if: steps.need.outputs.build == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: build
        if: steps.need.outputs.build == 'true'
        run: |
          python -m pip install "cmake>=4" ninja
          cmake -S occt -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/occt-prefix" \
            -DBUILD_LIBRARY_TYPE=Static \
            -DBUILD_MODULE_FoundationClasses=ON \
            -DBUILD_MODULE_ModelingData=ON \
            -DBUILD_MODULE_ModelingAlgorithms=ON \
            -DBUILD_MODULE_DataExchange=ON \
            -DBUILD_MODULE_Visualization=OFF \
            -DBUILD_MODULE_ApplicationFramework=OFF \
            -DBUILD_MODULE_Draw=OFF \
            -DBUILD_MODULE_DETools=OFF \
            -DUSE_FREETYPE=OFF \
            -DUSE_OPENGL=OFF \
            -DUSE_XLIB=OFF \
            -DBUILD_DOC_Overview=OFF \
            2>&1 | tee occt-configure.log
          cmake --build build -j 3 2>&1 | tee occt-build.log
          cmake --install build 2>&1 | tee -a occt-build.log

      - name: libraries
        run: |
          find occt-prefix -name OpenCASCADEConfig.cmake
          find occt-prefix -name 'libTK*.a' | sort

  netgen:
    needs: occt
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: prefix
          key: ${{ env.NETGEN_CACHE_KEY }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: occt-prefix
          key: ${{ env.OCCT_CACHE_KEY }}
          fail-on-cache-miss: true

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: NGSolve/netgen
          ref: ${{ env.NETGEN_COMMIT }}
          path: netgen
          fetch-depth: 0
          submodules: recursive

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -m pip install "cmake>=4" ninja

      - name: python for ios
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o pyios.tgz https://github.com/beeware/Python-Apple-support/releases/download/3.13-b18/Python-3.13-iOS-support.b18.tar.gz
          mkdir pyios
          tar -xzf pyios.tgz -C pyios
          inc=$(find "$PWD/pyios" -type d -path '*ios-arm64/include/python3.13' | head -1)
          lib=$(find "$PWD/pyios" -path '*ios-arm64/Python.framework/Python' | head -1)
          echo "include $inc"
          echo "library $lib"
          echo "PY_IOS_INC=$inc" >> "$GITHUB_ENV"
          echo "PY_IOS_ROOT=$(dirname "$(dirname "$inc")")" >> "$GITHUB_ENV"
          echo "PY_IOS_LIB=$lib" >> "$GITHUB_ENV"

      - name: patch
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sed -i '' 's/^      if(NOT EMSCRIPTEN)$/      if(NOT EMSCRIPTEN AND NOT CMAKE_CROSSCOMPILING)/' netgen/CMakeLists.txt
          grep -n "if(NOT EMSCRIPTEN AND NOT CMAKE_CROSSCOMPILING)" netgen/CMakeLists.txt

      - name: occt config
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "OCCT_CMAKE_DIR=$(dirname "$(find "$PWD/occt-prefix" -name OpenCASCADEConfig.cmake | head -1)")" >> "$GITHUB_ENV"

      - name: makerls
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/host"
          c++ -O2 netgen/rules/makerlsfile.cpp -o "$RUNNER_TEMP/host/makerls"
          echo "$RUNNER_TEMP/host" >> "$GITHUB_PATH"

      - name: configure
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -S netgen -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/prefix" \
            -DUSE_SUPERBUILD=OFF \
            -DUSE_GUI=OFF \
            -DUSE_PYTHON=ON \
            -DUSE_OCC=ON \
            -DOpenCascade_DIR="$OCCT_CMAKE_DIR" \
            -DUSE_NATIVE_ARCH=OFF \
            -DBUILD_STUB_FILES=OFF \
            -DPREFER_SYSTEM_PYBIND11=OFF \
            -DPYBIND11_USE_CROSSCOMPILING=ON \
            -DPython3_EXECUTABLE="$(command -v python)" \
            -DPython3_INCLUDE_DIR="$PY_IOS_INC" \
            -DPython3_LIBRARY="$PY_IOS_LIB" \
            -DPython_ROOT_DIR="$PY_IOS_ROOT" \
            -DPython_INCLUDE_DIR="$PY_IOS_INC" \
            -DPython_LIBRARY="$PY_IOS_LIB" \
            -DNG_INSTALL_DIR_PYTHON=python \
            2>&1 | tee configure.log

      - name: build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake --build build -j 3 2>&1 | tee build.log
          cmake --install build 2>&1 | tee -a build.log
          find prefix -name '*.so' -o -name '*.dylib' -o -name 'NetgenConfig.cmake' | head -30

      - uses: actions/upload-artifact@v4
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          name: netgen-ios
          path: |
            configure.log
            build.log
            build/CMakeCache.txt

  ngsolve:
    needs: netgen
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: occt-prefix
          key: ${{ env.OCCT_CACHE_KEY }}
          fail-on-cache-miss: true

      - uses: actions/cache/restore@v4
        with:
          path: prefix
          key: ${{ env.NETGEN_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: netgen
        run: |
          echo "OCCT_CMAKE_DIR=$(dirname "$(find "$PWD/occt-prefix" -name OpenCASCADEConfig.cmake | head -1)")" >> "$GITHUB_ENV"
          echo "NETGEN_CMAKE_DIR=$(dirname "$(find "$PWD/prefix" -name NetgenConfig.cmake | head -1)")" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: NGSolve/ngsolve
          ref: ${{ env.NGSOLVE_COMMIT }}
          path: ngsolve
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: tools
        run: python -m pip install "cmake>=4" ninja

      - name: python for ios
        run: |
          curl -sSL -o pyios.tgz https://github.com/beeware/Python-Apple-support/releases/download/3.13-b18/Python-3.13-iOS-support.b18.tar.gz
          mkdir pyios
          tar -xzf pyios.tgz -C pyios
          inc=$(find "$PWD/pyios" -type d -path '*ios-arm64/include/python3.13' | head -1)
          lib=$(find "$PWD/pyios" -path '*ios-arm64/Python.framework/Python' | head -1)
          echo "PY_IOS_INC=$inc" >> "$GITHUB_ENV"
          echo "PY_IOS_ROOT=$(dirname "$(dirname "$inc")")" >> "$GITHUB_ENV"
          echo "PY_IOS_LIB=$lib" >> "$GITHUB_ENV"

      - name: kernel_generator
        run: |
          mkdir -p "$RUNNER_TEMP/host"
          c++ -std=c++20 -O2 ngsolve/basiclinalg/generate_mat_kernels.cpp -o "$RUNNER_TEMP/host/kernel_generator"
          echo "$RUNNER_TEMP/host" >> "$GITHUB_PATH"

      - name: configure
        run: |
          echo "netgen $NETGEN_CMAKE_DIR"
          echo "occt $OCCT_CMAKE_DIR"
          cmake -S ngsolve -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/ngsolve-prefix" \
            -DUSE_SUPERBUILD=OFF \
            -DNetgen_DIR="$NETGEN_CMAKE_DIR" \
            -DOpenCascade_DIR="$OCCT_CMAKE_DIR" \
            -DUSE_LAPACK=ON \
            -DLAPACK_LIBRARIES="-framework Accelerate" \
            -DUSE_MKL=OFF \
            -DUSE_PARDISO=OFF \
            -DUSE_UMFPACK=OFF \
            -DUSE_MUMPS=OFF \
            -DUSE_HYPRE=OFF \
            -DUSE_MPI=OFF \
            -DUSE_CUDA=OFF \
            -DUSE_GUI=OFF \
            -DUSE_NATIVE_ARCH=OFF \
            -DMAX_SYS_DIM=1 \
            -DUSE_FASTCOMPILE=1 \
            -DBUILD_STUB_FILES=OFF \
            -DBUILD_FOR_CONDA=ON \
            -DUSE_PYTHON=ON \
            -DPYBIND11_USE_CROSSCOMPILING=ON \
            -DPython3_EXECUTABLE="$(command -v python)" \
            -DPython3_INCLUDE_DIR="$PY_IOS_INC" \
            -DPython3_LIBRARY="$PY_IOS_LIB" \
            -DPython_ROOT_DIR="$PY_IOS_ROOT" \
            -DPython_INCLUDE_DIR="$PY_IOS_INC" \
            -DPython_LIBRARY="$PY_IOS_LIB" \
            -DNG_INSTALL_DIR_PYTHON=python \
            2>&1 | tee configure.log

      - name: build
        run: |
          cmake --build build -j 3 2>&1 | tee build.log
          cmake --install build 2>&1 | tee -a build.log
          find ngsolve-prefix -name '*.so' -o -name '*.dylib' | head -30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ngsolve-ios
          path: |
            configure.log
            build.log
            build/CMakeCache.txt
